<text x="662" y="237" font-size="12" font-weight="700" fill="#475569"></text>
<text x="694" y="237" font-size="14" font-weight="400" fill="#0f172a" font-family="Consolas, monospace">created_at</text>
<text x="1040" y="237" font-size="11.5" fill="#475569" text-anchor="end">DATETIME = CURRENT_TIMESTAMP</text>
<text x="850.0" y="268" font-size="12" fill="#475569" text-anchor="middle">ON DELETE RESTRICT, ON UPDATE CASCADE</text>

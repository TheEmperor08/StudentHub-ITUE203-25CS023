<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="400" viewBox="0 0 1080 400" font-family="Segoe UI, Arial, sans-serif">
<rect width="1080" height="400" fill="#ffffff"/>
<text x="30" y="38" font-size="22" font-weight="700" fill="#0b1437">ER diagram – studenthub_prac9</text>
<text x="30" y="64" font-size="14" fill="#475569">One user has zero or more audit-log entries; every registration adds one (crow's-foot notation; AI = AUTO_INCREMENT)</text>
<rect x="30" y="92" width="400" height="238" rx="10" fill="#ffffff" stroke="#0b1437" stroke-width="2"/>
<path d="M30 134 V102 a10 10 0 0 1 10 -10 H420 a10 10 0 0 1 10 10 V134 Z" fill="#0b1437"/>
<text x="230.0" y="120" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">users</text>
<rect x="32" y="134" width="396" height="28" fill="#fef3c7"/>
<text x="42" y="153" font-size="12" font-weight="700" fill="#92400e">PK</text>
<text x="74" y="153" font-size="14" font-weight="700" fill="#0f172a" font-family="Consolas, monospace">user_id</text>
<text x="420" y="153" font-size="11.5" fill="#475569" text-anchor="end">INT UNSIGNED, AI</text>
<line x1="32" y1="162" x2="428" y2="162" stroke="#e2e8f0"/>
<text x="42" y="181" font-size="12" font-weight="700" fill="#475569"></text>
<text x="74" y="181" font-size="14" font-weight="400" fill="#0f172a" font-family="Consolas, monospace">full_name</text>
<text x="420" y="181" font-size="11.5" fill="#475569" text-anchor="end">VARCHAR(100)</text>
<line x1="32" y1="190" x2="428" y2="190" stroke="#e2e8f0"/>
<text x="42" y="209" font-size="12" font-weight="700" fill="#475569">UK</text>
<text x="74" y="209" font-size="14" font-weight="400" fill="#0f172a" font-family="Consolas, monospace">username</text>
<text x="420" y="209" font-size="11.5" fill="#475569" text-anchor="end">VARCHAR(30), CHECK format</text>
<line x1="32" y1="218" x2="428" y2="218" stroke="#e2e8f0"/>
<text x="42" y="237" font-size="12" font-weight="700" fill="#475569">UK</text>
<text x="74" y="237" font-size="14" font-weight="400" fill="#0f172a" font-family="Consolas, monospace">email</text>
<text x="420" y="237" font-size="11.5" fill="#475569" text-anchor="end">VARCHAR(254), CHECK format</text>
<line x1="32" y1="246" x2="428" y2="246" stroke="#e2e8f0"/>
<text x="42" y="265" font-size="12" font-weight="700" fill="#475569"></text>
<text x="74" y="265" font-size="14" font-weight="400" fill="#0f172a" font-family="Consolas, monospace">password_hash</text>
<text x="420" y="265" font-size="11.5" fill="#475569" text-anchor="end">VARCHAR(255), CHECK bcrypt/Argon2</text>
<line x1="32" y1="274" x2="428" y2="274" stroke="#e2e8f0"/>
<text x="42" y="293" font-size="12" font-weight="700" fill="#475569"></text>
<text x="74" y="293" font-size="14" font-weight="400" fill="#0f172a" font-family="Consolas, monospace">role</text>
<text x="420" y="293" font-size="11.5" fill="#475569" text-anchor="end">ENUM(&#x27;student&#x27;,&#x27;admin&#x27;) = &#x27;student&#x27;</text>
<line x1="32" y1="302" x2="428" y2="302" stroke="#e2e8f0"/>
<text x="42" y="321" font-size="12" font-weight="700" fill="#475569"></text>
<text x="74" y="321" font-size="14" font-weight="400" fill="#0f172a" font-family="Consolas, monospace">created_at</text>
<text x="420" y="321" font-size="11.5" fill="#475569" text-anchor="end">DATETIME = CURRENT_TIMESTAMP</text>
<text x="230.0" y="352" font-size="12" fill="#475569" text-anchor="middle">UNIQUE (username), UNIQUE (email); all columns NOT NULL</text>
<rect x="650" y="92" width="400" height="154" rx="10" fill="#ffffff" stroke="#0b1437" stroke-width="2"/>
<path d="M650 134 V102 a10 10 0 0 1 10 -10 H1040 a10 10 0 0 1 10 10 V134 Z" fill="#0b1437"/>

<text x="1040" y="181" font-size="11.5" fill="#475569" text-anchor="end">INT UNSIGNED → users.user_id</text>
<line x1="652" y1="190" x2="1048" y2="190" stroke="#e2e8f0"/>
<text x="662" y="209" font-size="12" font-weight="700" fill="#475569"></text>
<text x="694" y="209" font-size="14" font-weight="400" fill="#0f172a" font-family="Consolas, monospace">action</text>
